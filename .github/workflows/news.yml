name: Haberleri Güncelle

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[Yeni Haber]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formdaki haberi veri dosyasına ekle
        id: add
        if: github.event_name == 'issues'
        run: python add_news_from_issue.py
      - name: Haber sayfalarını üret
        run: python generate_news.py
      - name: Değişiklikleri yayımla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news.html latest-news.html news/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Haberleri güncelle"
          git pull --rebase origin main
          git push
      - name: Formu tamamlandı olarak kapat
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Haber yayımlandı: https://${context.repo.owner}.github.io/${context.repo.repo}/news/${{ steps.add.outputs.slug }}.html`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
