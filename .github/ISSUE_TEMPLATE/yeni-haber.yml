name: Yeni Haber Ekle
description: Haberler sayfasına ve ana sayfadaki güncel haberler alanına yeni kayıt ekler.
title: "[Yeni Haber] "
labels: ["yeni-haber"]
body:
  - type: markdown
    attributes:
      value: "Formu doldurup gönderdiğinizde haber otomatik olarak kontrol edilir ve yayımlanır. Tarihi YYYY-AA-GG biçiminde yazın."
  - type: input
    id: title
    attributes:
      label: Haber başlığı
      placeholder: Haber başlığını yazın
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Tarih
      description: YYYY-AA-GG biçimini kullanın.
      placeholder: "2026-09-28"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Kategori
      options: [Akademik Başarı, Etkinlik, Kongre, Mezuniyet, Proje, Yayın, Grubumuzdan, Diğer]
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Kısa özet
      description: Ana sayfa kartında gösterilecek 1–2 cümle.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Ayrıntılı metin
      description: Haber ayrıntı sayfasında gösterilecek tam metin. Paragrafları boş satırla ayırabilirsiniz.
    validations:
      required: true
  - type: input
    id: image_url
    attributes:
      label: Görsel URL'si
      description: İsteğe bağlı, herkese açık https bağlantısı.
      placeholder: https://...
  - type: input
    id: image_alt
    attributes:
      label: Görsel açıklaması
      description: Erişilebilirlik için görseli kısa biçimde açıklayın.
  - type: input
    id: image_note
    attributes:
      label: Görsel notu
      description: Öne çıkan kartın görsel alanında gösterilecek kısa ifade.
  - type: input
    id: external_url
    attributes:
      label: Harici bağlantı
      description: Haber başka bir sayfaya yönlenecekse isteğe bağlı https bağlantısı.
      placeholder: https://...
  - type: dropdown
    id: featured
    attributes:
      label: Öne çıkarılsın mı?
      options: [Hayır, Evet]
    validations:
      required: true
